name: AI 수요 일일 수집

on:
  schedule:
    # 07:45 KST. Korea does not observe daylight saving, so 22:45 UTC is always 07:45 KST.
    - cron: "45 22 * * *"
    # 09:15 KST fallback when GitHub starts the 07:45 cron late. This trigger
    # checks data/history.csv from the fresh main checkout and skips when
    # today's KST row is already there.
    - cron: "15 0 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "드라이런 (메시지만 로그에 출력하고 CSV 기록과 텔레그램 전송은 생략)"
        type: boolean
        default: false
        required: false

concurrency:
  group: ai-demand-daily
  cancel-in-progress: false

jobs:
  collect:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout main
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Collect
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
          CHAT_ID: ${{ secrets.CHAT_ID }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            set -- --dry-run
          else
            set --
          fi
          # Only the 09:15 KST cron may skip. The 07:45 cron and manual runs always collect.
          if [ "${{ github.event.schedule }}" = "15 0 * * *" ]; then
            set -- "$@" --fallback
          fi
          python -m ai_demand "$@"

      - name: Commit data/history.csv
        if: ${{ github.event_name != 'workflow_dispatch' || github.event.inputs.dry_run != 'true' }}
        run: |
          git config user.name "ai-demand-bot"
          git config user.email "ai-demand-bot@users.noreply.github.com"
          git add data/history.csv
          if git diff --cached --quiet; then
            echo "No changes in data/history.csv"
            exit 0
          fi
          git commit -m "chore: update AI demand history [skip ci]"
          ok=0
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              ok=1
              break
            fi
            echo "push attempt ${attempt} failed"
            sleep $((attempt * 2))
          done
          if [ "$ok" != 1 ]; then
            echo "failed to push data/history.csv"
            exit 1
          fi
